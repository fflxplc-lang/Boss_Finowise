<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Freedom LifeX — Partner</title>
<style>
  :root{ --navy:#0F1B2D; --navy-2:#152541; --gold:#B9863E; --gold-light:#E8D3AE; --ink:#1B2233; --muted:#6B7280; --line:#E4E7EC; --bg:#F5F6F8;
    --ok:#166534; --ok-bg:#e7f5ee; --warn:#9a5b00; --warn-bg:#fff4e5; --danger:#B3432B; --danger-bg:#fdecea; --info:#1f5f8b; --info-bg:#eaf2f8; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  header{ background:linear-gradient(165deg,var(--navy),var(--navy-2)); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header .brand{ font-weight:700; letter-spacing:.3px; } header .brand span{ color:var(--gold-light); font-weight:500; }
  header a{ color:var(--gold-light); text-decoration:none; font-size:13px; }
  nav{ background:#fff; border-bottom:1px solid var(--line); display:flex; gap:2px; padding:0 12px; overflow-x:auto; }
  nav button{ background:none; border:0; border-bottom:3px solid transparent; padding:12px 14px; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; }
  nav button.on{ color:var(--navy); border-bottom-color:var(--gold); }
  main{ max-width:1000px; margin:0 auto; padding:18px 16px 60px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  h1{ font-size:20px; margin:0 0 4px; } h2{ font-size:15px; margin:0 0 10px; }
  .muted{ color:var(--muted); } .small{ font-size:12.5px; }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .kpi .l{ font-size:12px; color:var(--muted); } .kpi .v{ font-size:18px; font-weight:700; margin-top:3px; }
  .steps{ display:flex; gap:6px; flex-wrap:wrap; }
  .step{ font-size:12px; padding:6px 10px; border-radius:999px; background:#eef0f3; color:var(--muted); }
  .step.done{ background:var(--ok-bg); color:var(--ok); } .step.cur{ background:var(--navy); color:#fff; }
  table{ width:100%; border-collapse:collapse; } th,td{ text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ font-size:12px; color:var(--muted); font-weight:600; }
  .table-wrap{ overflow-x:auto; }
  .badge{ display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:#eef0f3; color:var(--muted); white-space:nowrap; }
  .badge.ok{ background:var(--ok-bg); color:var(--ok); } .badge.warn{ background:var(--warn-bg); color:var(--warn); }
  .badge.danger{ background:var(--danger-bg); color:var(--danger); } .badge.info{ background:var(--info-bg); color:var(--info); }
  .btn{ font:inherit; font-weight:600; border-radius:8px; padding:8px 14px; border:1px solid var(--line); background:#fff; color:var(--navy); cursor:pointer; }
  .btn.primary{ background:var(--navy); border-color:var(--navy); color:#fff; } .btn.sm{ padding:5px 10px; font-size:12.5px; }
  .btn[disabled]{ opacity:.6; cursor:default; }
  .kv{ display:grid; grid-template-columns:200px 1fr; gap:8px 14px; } .kv div:nth-child(odd){ color:var(--muted); }
  @media (max-width:600px){ .kv{ grid-template-columns:1fr; } .kv div:nth-child(odd){ margin-top:6px; } }
  .field{ margin-bottom:10px; } .field label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; }
  input,select,textarea{ width:100%; font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea{ min-height:80px; resize:vertical; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; } @media (max-width:600px){ .grid{ grid-template-columns:1fr; } }
  .msg{ padding:10px 12px; border-radius:8px; margin:8px 0; } .msg.err{ background:var(--danger-bg); color:var(--danger); }
  .msg.ok{ background:var(--ok-bg); color:var(--ok); } .msg.info{ background:var(--info-bg); color:var(--info); }
  .next li{ margin:6px 0; } .lock{ color:var(--muted); font-size:12.5px; }
  .note{ font-size:12.5px; margin-top:4px; }
  .bar{ height:8px; border-radius:4px; background:#eef0f3; overflow:hidden; min-width:90px; } .bar i{ display:block; height:100%; border-radius:4px; }
  .bar i.ok{ background:var(--ok); } .bar i.info{ background:var(--info); } .bar i.warn{ background:var(--warn); } .bar i.danger{ background:var(--danger); }
  .up{ color:var(--ok); font-weight:600; } .down{ color:var(--danger); font-weight:600; } .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .c-ok{ background:var(--ok-bg); } .c-info{ background:var(--info-bg); } .c-warn{ background:var(--warn-bg); } .c-danger{ background:var(--danger-bg); } .future{ opacity:.5; }
  .pill{ display:inline-flex; gap:4px; } .pill button{ font:inherit; font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--muted); cursor:pointer; }
  .pill button.on{ background:var(--navy); border-color:var(--navy); color:#fff; }
</style>
</head>
<body>
<header><div class="brand" id="brand">Freedom LifeX <span>· Partner</span></div><div><span id="who"></span> &nbsp; <a href="/partner/logout">Sign out</a></div></header>
<nav id="nav"></nav>
<main id="main"><div class="card muted">Loading…</div></main>
<script>
(function(){
  var ME = null, TAB = 'home', LEADS = null, EDIT_LEAD = null, PERF = null, PMODE = 'month', CLIENTS = null, PAYOUTS = null, JID = null, JITEM = null;
  try { TAB = sessionStorage.getItem('flxTab') || 'home'; } catch(e) {}
  var main = document.getElementById('main');
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function date(s){ if(!s) return '—'; var d = new Date(String(s).length <= 10 ? s + 'T00:00:00' : s); return isNaN(d) ? esc(s) : d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}); }
  function money(n, cur){ var v = Number(n) || 0; return (cur && cur !== 'INR' ? cur + ' ' : '₹') + v.toLocaleString('en-IN'); }
  function badge(s){
    var tone = /^(Approved|Paid|Accepted|Active|Completed)$/.test(s) ? 'ok' : /^(Rejected|Failed|Changes Required|Suspended)$/.test(s) ? 'danger'
      : /^(Pending Review|Under Review|Submitted|Resubmitted|In Progress|Pending)$/.test(s) ? 'warn' : /^(Not Started|Not Submitted|Draft)$/.test(s) ? '' : 'info';
    return '<span class="badge ' + tone + '">' + esc(s || '—') + '</span>';
  }
  function api(path, opts){
    return fetch('/api/partner-portal/' + path, Object.assign({headers:{'Content-Type':'application/json'}, credentials:'same-origin'}, opts || {}))
      .then(function(r){ if(r.status === 401){ location.href = '/partner/login'; throw new Error('signed out'); } return r.json(); });
  }
  function load(){
    return api('me').then(function(d){
      if(!d.ok){ main.innerHTML = '<div class="msg err">' + esc(d.message || 'Could not load your record.') + '</div>'; return; }
      ME = d;
      document.getElementById('brand').innerHTML = esc(d.firm) + ' <span>· Partner</span>';
      document.getElementById('who').textContent = d.partner.name;
      draw();
    });
  }
  var TABS = [['home','Dashboard'], ['profile','My Profile'], ['empanelment','Empanelment & Documents'], ['tasks','My Tasks'], ['journey','Client Journey'], ['clients','My Clients'], ['performance','My Performance'], ['payments','Payments'], ['payouts','My Payouts']];
  // A section is shown only when the partner's login opens it (Setup › Partner Login Access in BOSS).
  function opens(k){ return k === 'home' ? true : !ME.access || ME.access.indexOf(k) >= 0; }
  function go(t){ TAB = t; JID = null; JITEM = null; try { sessionStorage.setItem('flxTab', t); } catch(e) {} draw(); window.scrollTo(0, 0); }
  window.flxGo = go;
  function draw(){
    var tabs = TABS.filter(function(t){ return opens(t[0]) && (t[0] === 'performance' ? (ME.partner.role || ME.stage.id === 'active') : (t[0] !== 'payments' || ME.due > 0 || ME.payments.length)); });
    if(!tabs.some(function(t){ return t[0] === TAB; })) TAB = 'home';
    document.getElementById('nav').innerHTML = tabs.map(function(t){
      var n = t[0] === 'tasks' ? ME.tasks.filter(function(x){ return x.maySubmit; }).length : 0;
      return '<button class="' + (TAB === t[0] ? 'on' : '') + '" onclick="flxGo(\'' + t[0] + '\')">' + esc(t[1]) + (n ? ' (' + n + ')' : '') + '</button>';
    }).join('');
    var f = {home: home, profile: profile, empanelment: empanelment, tasks: tasks, journey: journey, performance: performance, payments: payments, clients: clients, payouts: payouts}[TAB] || home;
    main.innerHTML = f();
    if(TAB === 'journey' && ME.clientJourney.open && !LEADS) loadLeads();
    if(TAB === 'journey' && JID && (!JITEM || JITEM.id !== JID)) loadItem();
    if(TAB === 'performance' && !PERF) loadPerf();
    if(TAB === 'clients' && !CLIENTS) api('clients').then(function(d){ CLIENTS = d; if(TAB === 'clients') main.innerHTML = clients(); });
    if(TAB === 'payouts' && !PAYOUTS) api('payouts').then(function(d){ PAYOUTS = d; if(TAB === 'payouts') main.innerHTML = payouts(); });
    wire();
  }
  function kv(rows){ return '<div class="kv">' + rows.map(function(r){ return '<div>' + esc(r[0]) + '</div><div>' + (r[2] ? r[1] : esc(r[1] || '—')) + '</div>'; }).join('') + '</div>'; }

  function home(){
    var p = ME.partner, open = ME.tasks.filter(function(t){ return t.maySubmit; }), back = ME.tasks.filter(function(t){ return t.status === 'Changes Required'; });
    var pending = ME.tasks.filter(function(t){ return t.status === 'Pending Review'; });
    var next = [];
    if(ME.empanelment.formOpen) next.push('<a href="' + esc(ME.empanelment.formUrl) + '">Fill in your empanelment form</a> — your details, documents and the agreement, in one place.');
    if(ME.mayRecordPayment && !ME.payments.some(function(x){ return x.status === 'Under Review' || x.status === 'Paid'; })) next.push('<a href="javascript:flxGo(\'payments\')">Record your payment</a> of ' + money(ME.due, ME.currency) + '.');
    back.forEach(function(t){ next.push('Your mentor asked for changes to <a href="javascript:flxGo(\'tasks\')">' + esc(t.title) + '</a>.'); });
    open.filter(function(t){ return t.status !== 'Changes Required'; }).slice(0, 3).forEach(function(t){ next.push('Submit <a href="javascript:flxGo(\'tasks\')">' + esc(t.title) + '</a> for review.'); });
    if(ME.clientJourney.open) next.push('<a href="javascript:flxGo(\'journey\')">Add your leads</a> in the Client Journey.');
    return '<div class="card"><h1>Welcome, ' + esc(p.firstName || p.name) + '</h1><div class="muted">' + esc(p.partnerCode) + (p.role ? ' · ' + esc(p.role) : '') + ' · ' + badge(p.status) + '</div></div>'
      + '<div class="kpis">'
      + '<div class="kpi"><div class="l">Where you are</div><div class="v" style="font-size:15px">' + esc(ME.stage.label) + '</div></div>'
      + '<div class="kpi"><div class="l">Your RM</div><div class="v" style="font-size:15px">' + esc(p.rm || '—') + '</div></div>'
      + '<div class="kpi"><div class="l">Your mentor</div><div class="v" style="font-size:15px">' + esc(p.mentor || '—') + '</div></div>'
      + '<div class="kpi"><div class="l">Tasks waiting on you</div><div class="v">' + open.length + '</div></div>'
      + '<div class="kpi"><div class="l">With your mentor</div><div class="v">' + pending.length + '</div></div>'
      + '</div>'
      + '<div class="card"><h2>Your onboarding</h2><div class="steps">' + ME.stage.steps.map(function(s){
          return '<span class="step ' + (s.current ? 'cur' : s.done ? 'done' : '') + '">' + (s.done ? '✓ ' : '') + esc(s.label) + '</span>'; }).join('') + '</div></div>'
      + '<div class="card"><h2>What to do next</h2>' + (next.length ? '<ul class="next">' + next.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>'
          : '<div class="muted">Nothing is waiting on you right now. Your RM will be in touch about the next step.</div>') + '</div>'
      + (!opens('journey') && !opens('clients') ? '' : '<div class="card"><h2>Your figures</h2><div class="kpis" style="margin:0">'
      + [['leads','Leads collected'], ['conversions','Leads converted'], ['clients','Clients onboarded']].map(function(m){
          return '<div class="kpi"><div class="l">' + m[1] + '</div><div class="v">' + (ME.figures[m[0]] || 0) + '</div></div>'; }).join('') + '</div>'
      + '<div class="muted small" style="margin-top:8px">Counted from the leads you add in the Client Journey. ' + esc(ME.clientJourney.reason) + '</div></div>')
      + (opens('clients') || opens('performance') || opens('payouts') ? '<div class="card"><h2>Also in your login</h2><ul class="next">'
        + (opens('clients') ? '<li><a href="javascript:flxGo(\'clients\')">My Clients</a> — the clients your leads became, and their business.</li>' : '')
        + (opens('performance') && (ME.partner.role || ME.stage.id === 'active') ? '<li><a href="javascript:flxGo(\'performance\')">My Performance</a> — your targets against what you achieved.</li>' : '')
        + (opens('payouts') ? '<li><a href="javascript:flxGo(\'payouts\')">My Payouts</a> — what the firm pays you, month by month.</li>' : '')
        + '</ul></div>' : '');
  }
  function profile(){
    var p = ME.partner;
    return '<div class="card"><h2>My Profile</h2>' + kv([['Name', p.name], ['Partner code', p.partnerCode], ['Application', p.applicationId], ['Role', p.role || (p.proposedRole ? 'Proposed: ' + p.proposedRole : '')],
        ['Email', p.email], ['Mobile', p.mobile], ['Address', p.address], ['City', p.city], ['PAN', p.pan], ['Bank account', p.bank],
        ['Registered', date(p.registrationDate), 1], ['Your RM', p.rm], ['Your mentor', p.mentor], ['Status', badge(p.status), 1], ['Active since', p.activatedAt ? date(p.activatedAt) : '', 1]])
      + '<div class="muted small" style="margin-top:12px">Something wrong? ' + (ME.empanelment.formOpen ? 'Correct it on your <a href="' + esc(ME.empanelment.formUrl) + '">empanelment form</a>.' : 'Ask your RM to change it.') + '</div></div>'
      + '<div class="card"><h2>Change your password</h2><div class="grid"><div class="field"><label>Current password</label><input type="password" id="pwCur" autocomplete="current-password"></div>'
      + '<div class="field"><label>New password (at least 8 characters)</label><input type="password" id="pwNew" autocomplete="new-password"></div></div>'
      + '<div id="pwMsg"></div><button class="btn primary" id="pwSave">Change Password</button></div>';
  }
  function fileLink(id, name){ return id ? '<a href="/api/partner-portal/files/' + encodeURIComponent(id) + '" target="_blank" rel="noopener">' + esc(name || 'open') + '</a>' : ''; }
  function empanelment(){
    var e = ME.empanelment, a = ME.agreement;
    var dec = e.decision ? '<div class="msg ' + (e.decision.decision === 'Approved' ? 'ok' : e.decision.decision === 'Rejected' ? 'err' : 'info') + '">'
      + esc(e.decision.decision) + (e.decision.reason ? ': ' + esc(e.decision.reason) : '') + (e.decision.at ? ' <span class="small">(' + date(e.decision.at) + ')</span>' : '') + '</div>' : '';
    return '<div class="card"><h2>Empanelment</h2>' + kv([['Application', badge(e.status), 1], ['Submitted', e.submittedAt ? date(e.submittedAt) : '', 1]]) + dec
      + (e.formOpen ? '<div style="margin-top:10px"><a class="btn primary" href="' + esc(e.formUrl) + '" style="text-decoration:none;display:inline-block">Open my empanelment form</a></div>' : '') + '</div>'
      + '<div class="card"><h2>Agreement</h2>' + (a ? kv([['Status', badge('Accepted'), 1], ['Agreements', (a.types || []).join(', ')], ['Version', a.version], ['Accepted on', date(a.acceptedAt), 1],
          ['Signed as', a.signedName], ['How', a.evidence], ['Signed copy', a.signedFileId ? fileLink(a.signedFileId, 'download') : '', 1]])
        : '<div class="muted">Not accepted yet. It is part of your empanelment form.</div>') + '</div>'
      + '<div class="card"><h2>Documents</h2><div class="table-wrap"><table><thead><tr><th>Document</th><th>Status</th><th>Your uploads</th></tr></thead><tbody>'
      + ME.documents.map(function(d){
          return '<tr><td><b>' + esc(d.type) + '</b>' + (d.mandatory ? ' <span class="muted small">required</span>' : '') + '</td><td>' + badge(d.status)
            + (d.reason ? '<div class="note" style="color:var(--danger)">' + esc(d.reason) + '</div>' : '') + '</td><td>'
            + (d.versions.length ? d.versions.map(function(v){ return 'v' + v.v + ' · ' + fileLink(v.fileId, v.name) + ' <span class="muted small">' + date(v.uploadedAt) + '</span>'; }).join('<br>') : '—') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
  }
  function tasks(){
    if(!ME.tasks.length) return '<div class="card"><h2>My Tasks</h2><div class="muted">Your tasks arrive once your role is confirmed at the one-to-one with your RM.</div></div>';
    var table = function(phase, title){
      var list = ME.tasks.filter(function(t){ return t.phase === phase; });
      if(!list.length) return '';
      return '<div class="card"><h2>' + title + '</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>Task</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>'
        + list.map(function(t, i){
            var last = t.reviews.length ? t.reviews[t.reviews.length - 1] : null;
            return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(t.title) + '</b>' + (t.required ? '' : ' <span class="muted small">optional</span>')
              + (!t.open && t.reason ? '<div class="lock">🔒 ' + esc(t.reason) + '</div>' : '')
              + (t.evidence ? '<div class="note muted">You said: ' + esc(t.evidence) + '</div>' : '')
              + (t.status === 'Changes Required' && t.lastNote ? '<div class="note" style="color:var(--danger)">Your mentor: ' + esc(t.lastNote) + '</div>' : '')
              + (t.status === 'Approved' && last && last.comments ? '<div class="note" style="color:var(--ok)">' + esc(last.by) + ': ' + esc(last.comments) + '</div>' : '')
              + (t.maySubmit ? '<div id="sub_' + esc(t.id) + '" style="display:none;margin-top:8px"><textarea id="ev_' + esc(t.id) + '" placeholder="What did you do? A note or a link to your work — your mentor reads this."></textarea>'
                  + '<div id="se_' + esc(t.id) + '"></div><button class="btn primary sm" data-send="' + esc(t.id) + '">' + (t.needsReview ? 'Submit for Review' : 'Mark Done') + '</button></div>' : '')
              + '</td><td>' + date(t.dueDate) + '</td><td>' + badge(t.status) + '</td><td>'
              + (t.maySubmit ? '<button class="btn sm" data-open="' + esc(t.id) + '">' + (t.status === 'Changes Required' ? 'Resubmit' : t.needsReview ? 'Submit for Review' : 'Mark Done') + '</button>'
                  : t.kind !== 'task' && t.open && t.status !== 'Approved' ? '<span class="muted small">Your RM records this</span>' : '') + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
    };
    return '<div class="card muted small">Submit a task when it is done. Your mentor, ' + esc(ME.partner.mentor || 'your RM') + ', reviews it: once it is approved the next one opens by itself; if changes are needed it comes back to you with their comments.</div>'
      + table('onboarding', 'Onboarding tasks') + table('growth', 'Growth tasks — once you are active');
  }
  function journey(){
    var cj = ME.clientJourney;
    if(!cj.open) return '<div class="card"><h2>Client Journey</h2><div class="msg info">' + esc(cj.reason) + '</div></div>';
    if(JID) return journeyItem();
    var l = EDIT_LEAD || {};
    var today = new Date().toISOString().slice(0, 10);
    var due = (LEADS || []).filter(function(x){ return x.followUp && x.followUp <= today; });
    return (due.length ? '<div class="card"><h2>Follow-ups due</h2><ul class="next">' + due.map(function(x){
        return '<li><a href="javascript:void(0)" data-jopen="' + esc(x.id) + '">' + esc(x.name) + '</a> — ' + (x.followUp < today ? '<span class="down">overdue since ' + date(x.followUp) + '</span>' : 'today') + '</li>'; }).join('') + '</ul></div>' : '')
      + '<div class="kpis">' + [['leads','Leads collected'], ['conversions','Leads converted'], ['clients','Clients onboarded']].map(function(m){
        return '<div class="kpi"><div class="l">' + m[1] + '</div><div class="v">' + (ME.figures[m[0]] || 0) + '</div></div>'; }).join('') + '</div>'
      + '<div class="card"><h2>' + (EDIT_LEAD ? 'Change ' + esc(l.name) : 'Add a lead') + '</h2><div class="grid">'
      + [['firstName','First name *'], ['lastName','Last name'], ['mobile','Mobile *'], ['email','Email'], ['city','City'], ['productInterest','Interested in']].map(function(f){
          return '<div class="field"><label>' + f[1] + '</label><input id="ld_' + f[0] + '" value="' + esc(l[f[0]] || '') + '"' + (f[0] === 'mobile' ? ' inputmode="numeric" maxlength="10"' : '') + '></div>'; }).join('')
      + '</div><div class="field"><label>Notes</label><textarea id="ld_description">' + esc(l.description || '') + '</textarea></div><div id="ldMsg"></div>'
      + '<button class="btn primary" id="ldSave">' + (EDIT_LEAD ? 'Save Changes' : 'Add Lead') + '</button>' + (EDIT_LEAD ? ' <button class="btn" id="ldCancel">Cancel</button>' : '')
      + '<div class="muted small" style="margin-top:8px">Your lead goes to your RM, ' + esc(ME.partner.rm || '') + ', who works it through the Client Journey with you. Each one counts in your figures.</div></div>'
      + '<div class="card"><h2>My leads</h2>' + (LEADS === null ? '<div class="muted">Loading…</div>'
        : !LEADS.length ? '<div class="muted">No leads yet.</div>'
        : '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>City</th><th>Stage</th><th>Journey</th><th>Follow up</th><th>Added</th><th></th></tr></thead><tbody>'
          + LEADS.map(function(x){ return '<tr><td><b>' + esc(x.name) + '</b>' + (x.interest ? '<div class="muted small">' + esc(x.interest) + '</div>' : '') + '</td><td>' + esc(x.mobile) + '</td><td>' + esc(x.city || '—')
            + '</td><td>' + (x.client ? badge('Client') + ' ' : '') + esc(x.stage) + (x.meetingAsked ? '<div class="muted small">Meeting asked</div>' : '') + '</td>'

      + '<div class="kpis">'
      + '<div class="kpi"><div class="l">Overall · ' + esc(view.periods[0].label) + '</div><div class="v">' + (cur.overall == null ? '—' : cur.overall.toFixed(1) + '%') + '</div>' + (s ? '<span class="badge ' + s[2] + '">' + s[1] + '</span>' : '<span class="badge">No target yet</span>') + '</div>'
      + '<div class="kpi"><div class="l">Targets met</div><div class="v">' + (aimed.length ? hit + ' of ' + aimed.length : '—') + '</div></div>'
      + '<div class="kpi"><div class="l">Change vs ' + esc(view.periods[1].label) + '</div><div class="v" style="font-size:16px">' + (cur.overall == null || p1.overall == null ? '—' : growth(cur.overall, p1.overall)) + '</div></div>'

      + '<div class="table-wrap"><table><thead><tr><th>Measure</th><th class="num">Target</th><th class="num">Achieved</th><th>Achievement</th><th class="num">' + esc(view.periods[1].label) + '</th><th class="num">Growth</th><th class="num">' + esc(view.periods[2].label) + '</th><th class="num">Growth</th></tr></thead>'
      + '<tbody>' + (rows || '<tr><td colspan="8" class="muted">Your targets have not been set yet. Your RM sets them with you at your Target Setting.</td></tr>') + '</tbody></table></div></div>'
      + '<div class="card"><h2>Month by month — ' + esc(y) + '</h2><div class="table-wrap"><table><thead><tr><th>Measure</th>' + PERF.months.map(function(x){ return '<th class="num">' + esc(x.label.slice(0, 3)) + '</th>'; }).join('') + '</tr></thead>'

      + '<div class="card"><h2>Reviews</h2><div class="kv">'

  function readFile(input){
    var file = input && input.files && input.files[0];
    if(!file) return Promise.resolve(null);
    if(file.size > 5 * 1024 * 1024) return Promise.reject(new Error('The receipt is over 5 MB.'));
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onload = function(){ api('upload', {method:'POST', body: JSON.stringify({name: file.name, mime: file.type, data: String(fr.result || '')})})
        .then(function(r){ r.ok ? resolve(r) : reject(new Error(r.message || 'The upload failed.')); }, reject); };
      fr.onerror = function(){ reject(new Error('The file could not be read.')); };
      fr.readAsDataURL(file);
    });
  }

    if(py) py.onclick = function(){
      py.disabled = true;
      readFile(document.getElementById('py_file')).then(function(f){
        return api('payments', {method:'POST', body: JSON.stringify({amount: document.getElementById('py_amount').value, date: document.getElementById('py_date').value,
          method: document.getElementById('py_method').value, ref: document.getElementById('py_ref').value.trim(),
          receiptFileId: f ? f.id : '', receiptName: f ? f.name : ''})});
      }).then(function(r){
        py.disabled = false;
        if(!r.ok) return msg('pyMsg', r.message || 'That did not go through.');
        load();
      }, function(e){ py.disabled = false; msg('pyMsg', e.message); });
    };
  }
  load().catch(function(e){ if(e.message !== 'signed out') main.innerHTML = '<div class="msg err">Could not reach us. Refresh to try again.</div>'; });
})();
</script>
</body>
</html>
